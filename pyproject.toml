[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-fuse-calculator"
version = "0.1.0"
description = "Fuse sizing, placement, and coordination tool for radial distribution feeders (ECE 6320 term project)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Gabriel Chamon" },
    { name = "Micheal Elrod-Mocek" },
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fusecalc = "fusecalc.gui.app:main"

[tool.setuptools.packages.find]
include = ["fusecalc*"]

[tool.setuptools.package-data]
fusecalc = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
